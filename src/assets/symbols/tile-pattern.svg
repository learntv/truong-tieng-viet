<svg xmlns="http://www.w3.org/2000/svg" width="160" height="380" viewBox="0 0 160 380" opacity="0.2">
  <!-- Dense, edge-to-edge tile: two columns, slight rotation per icon for an organic feel.
       Column 2 is shifted down half a row (zigzag/brick) relative to column 1, and uses a
       cyclic shift of the icon order so the same icon never lines up with its neighbor.
       Column 2's last row sits on the tile's top/bottom seam, drawn at both y=0 and y=TH.
       Root opacity is 0.2 so the pattern reads as a subtle texture. -->
  <g transform="translate(40.0,38.0) rotate(-9)"><image href="data:image/png;base64," x="-18.0" y="-13.5" width="36" height="27" /></g>
<g transform="translate(40.0,114.0) rotate(7)"><image href="data:image/png;base64," x="-18.0" y="-13.5" width="36" height="27" /></g>
<g transform="translate(40.0,190.0) rotate(-6)"><image href="data:image/png;base64," x="-18.0" y="-17.0" width="36" height="34" /></g>
<g transform="translate(40.0,266.0) rotate(10)"><image href="data:image/png;base64," x="-9.5" y="-18.0" width="19" height="36" /></g>
<g transform="translate(40.0,342.0) rotate(-4)"><image href="data:image/png;base64," x="-17.5" y="-18.0" width="35" height="36" /></g>
