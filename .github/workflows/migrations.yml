# Database migrations for production, run from CI rather than from a Vercel build.
#
# Vercel builds are the wrong place for this: they run for every preview deploy and for
# rollbacks, they can run concurrently, and a build that is later discarded would still
# have migrated the production database. This workflow is the single writer.
#
# Both schemas are handled here so there is one place to look when a deploy goes wrong:
#   public  -> supabase db push       (supabase/migrations/*.sql)
#   payload -> payload migrate        (cms/src/migrations/*.ts)
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN  - personal access token, supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - the project's database password
#   SUPABASE_PROJECT_ID    - project ref (hruxdbfqkyneltdshddj)
#   DATABASE_URL           - direct Postgres connection string used by Payload
#   PAYLOAD_SECRET         - same value the CMS runtime uses

name: Migrate production database

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'cms/src/migrations/**'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:

# Never let two migration runs overlap; queue them instead of racing.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push public-schema migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db push

      # Guarded so this workflow is valid on branches where the CMS is not present yet.
      - name: Detect the CMS workspace
        id: cms
        run: echo "present=${{ hashFiles('cms/package.json') != '' }}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.cms.outputs.present == 'true'
        with:
          bun-version: latest

      - name: Install CMS dependencies
        if: steps.cms.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - name: Run Payload migrations
        if: steps.cms.outputs.present == 'true'
        working-directory: cms
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: bun run payload migrate
